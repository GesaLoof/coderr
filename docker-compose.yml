services:
  db:
    image: postgres:15
    container_name: coderr_database
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coderr_backend
    env_file: .env
    volumes:
      - .:/usr/src/app
      - static_volume:/usr/src/app/static
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: coderr_nginx
    ports:
      - "80:80"
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf
    - static_volume:/usr/src/app/static
    - /code/project.Coderr:/code/project.Coderr
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: